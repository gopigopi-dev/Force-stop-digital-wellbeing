<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 720" width="320" height="640">
  <defs>
    <filter id="cardShadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Phone Frame -->
  <rect x="6" y="6" width="348" height="708" rx="38" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="6"/>

  <!-- Header -->
  <text x="26" y="54" font-family="sans-serif" font-size="18" font-weight="bold" fill="#0F172A">← Permission Setup Guide</text>
  <text x="48" y="72" font-family="sans-serif" font-size="11" fill="#64748B">Enable core Android APIs for enforcement</text>

  <!-- Progress Banner -->
  <rect x="22" y="88" width="316" height="74" rx="18" fill="#EEF2FF"/>
  <circle cx="48" cy="120" r="16" fill="#4F46E5"/>
  <text x="48" y="125" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#FFFFFF">🛡️</text>
  <text x="74" y="116" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0F172A">Setup Progress: 1 of 2 Enabled</text>
  <text x="74" y="132" font-family="sans-serif" font-size="11" fill="#475569">Complete steps below to activate blocking</text>
  <rect x="38" y="144" width="284" height="6" rx="3" fill="#FFFFFF"/>
  <rect x="38" y="144" width="142" height="6" rx="3" fill="#4F46E5"/>

  <!-- Step 1 Card: Usage Access -->
  <rect x="22" y="176" width="316" height="248" rx="22" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5" filter="url(#cardShadow2)"/>
  <rect x="38" y="192" width="60" height="20" rx="10" fill="#EEF2FF"/>
  <text x="68" y="206" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#4F46E5">STEP 1</text>
  <rect x="254" y="192" width="68" height="20" rx="10" fill="#ECFDF5"/>
  <text x="288" y="206" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#10B981">✓ Enabled</text>

  <text x="38" y="232" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0F172A">Usage Access Permission</text>
  
  <!-- Illustration Box 1 -->
  <rect x="38" y="244" width="284" height="106" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/>
  <rect x="56" y="256" width="64" height="82" rx="10" fill="#1E293B"/>
  <rect x="62" y="264" width="52" height="66" rx="6" fill="#FFFFFF"/>
  <rect x="68" y="274" width="40" height="6" rx="3" fill="#EF4444"/>
  <rect x="68" y="288" width="32" height="6" rx="3" fill="#8B5CF6"/>
  <rect x="68" y="302" width="22" height="6" rx="3" fill="#10B981"/>
  <text x="136" y="282" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0F172A">📊 Reads App Timers</text>
  <text x="136" y="302" font-family="sans-serif" font-size="11" fill="#475569">Detects YouTube &amp; Instagram</text>
  <text x="136" y="318" font-family="sans-serif" font-size="11" fill="#475569">80% &amp; 100% daily usage</text>

  <rect x="38" y="366" width="284" height="40" rx="12" fill="#ECFDF5" stroke="#10B981"/>
  <text x="180" y="391" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#10B981">✓ Usage Access Granted</text>

  <!-- Step 2 Card: Display Over Other Apps -->
  <rect x="22" y="438" width="316" height="254" rx="22" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#cardShadow2)"/>
  <rect x="38" y="454" width="60" height="20" rx="10" fill="#F3E8FF"/>
  <text x="68" y="468" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#8B5CF6">STEP 2</text>
  <rect x="234" y="454" width="88" height="20" rx="10" fill="#FFFBEB"/>
  <text x="278" y="468" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#D97706">Action Needed</text>

  <text x="38" y="494" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0F172A">Display Over Other Apps</text>

  <!-- Illustration Box 2 -->
  <rect x="38" y="506" width="284" height="106" rx="14" fill="#FAF5FF" stroke="#E9D5FF"/>
  <rect x="54" y="522" width="56" height="72" rx="10" fill="#CBD5E1"/>
  <rect x="68" y="514" width="58" height="74" rx="10" fill="#4F46E5"/>
  <circle cx="97" cy="546" r="12" fill="#FFFFFF"/>
  <circle cx="97" cy="546" r="5" fill="#EF4444"/>
  <text x="142" y="544" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0F172A">🔒 Instant Lock Shield</text>
  <text x="142" y="564" font-family="sans-serif" font-size="11" fill="#475569">Draws full-screen blocker</text>
  <text x="142" y="580" font-family="sans-serif" font-size="11" fill="#475569">when time limit hits 100%</text>

  <rect x="38" y="630" width="284" height="44" rx="12" fill="#8B5CF6"/>
  <text x="180" y="657" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">Open Overlay Settings →</text>
</svg>
