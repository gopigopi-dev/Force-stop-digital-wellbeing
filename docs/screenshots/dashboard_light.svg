<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 720" width="320" height="640">
  <defs>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Phone Frame -->
  <rect x="6" y="6" width="348" height="708" rx="38" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="6"/>
  
  <!-- Header -->
  <circle cx="34" cy="48" r="6" fill="#10B981"/>
  <text x="48" y="52" font-family="sans-serif" font-size="11" font-weight="bold" fill="#4F46E5" letter-spacing="1.5">FORCE STOP</text>
  <text x="26" y="76" font-family="sans-serif" font-size="19" font-weight="bold" fill="#0F172A">Take control of your time</text>
  <text x="26" y="96" font-family="sans-serif" font-size="12" fill="#64748B">Saturday, November 7 • Light Mode</text>

  <!-- Total Screen Time Gauge Card -->
  <rect x="22" y="114" width="316" height="236" rx="22" fill="#FFFFFF" filter="url(#cardShadow)"/>
  <text x="180" y="142" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0F172A">Total Screen Time</text>

  <!-- Background Arc -->
  <circle cx="180" cy="222" r="62" fill="none" stroke="#F1F5F9" stroke-width="14" stroke-dasharray="280 390" stroke-dashoffset="-55" stroke-linecap="round"/>
  <!-- Foreground Arc -->
  <circle cx="180" cy="222" r="62" fill="none" stroke="url(#ringGrad)" stroke-width="14" stroke-dasharray="195 390" stroke-dashoffset="-55" stroke-linecap="round"/>

  <text x="180" y="220" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#0F172A">2h 18m</text>
  <text x="180" y="238" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748B">of 3h 0m limit</text>
  <text x="180" y="255" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#10B981">76% used</text>

  <!-- Status Pills -->
  <rect x="46" y="302" width="122" height="28" rx="10" fill="#EEF2FF"/>
  <text x="107" y="320" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#4F46E5">8 Limits Active</text>

  <rect x="186" y="302" width="126" height="28" rx="10" fill="#FEF2F2"/>
  <text x="249" y="320" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#EF4444">1 App Blocked</text>

  <!-- Entertainment Usage Card -->
  <rect x="22" y="366" width="316" height="106" rx="20" fill="#FFFFFF" filter="url(#cardShadow)"/>
  <circle cx="48" cy="398" r="16" fill="#F3E8FF"/>
  <text x="48" y="403" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#8B5CF6">🎬</text>
  <text x="74" y="395" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0F172A">Entertainment Usage</text>
  <text x="74" y="411" font-family="sans-serif" font-size="11" fill="#64748B">80% &amp; 100% Real-Time Alerts Active</text>
  <text x="40" y="438" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0F172A">1h 12m used</text>
  <text x="320" y="438" text-anchor="end" font-family="sans-serif" font-size="12" fill="#8B5CF6">80% Warning</text>
  <rect x="40" y="448" width="280" height="8" rx="4" fill="#F1F5F9"/>
  <rect x="40" y="448" width="224" height="8" rx="4" fill="#8B5CF6"/>

  <!-- Dedicated YouTube Card -->
  <rect x="22" y="488" width="316" height="136" rx="20" fill="#FFFFFF" filter="url(#cardShadow)"/>
  <rect x="38" y="504" width="34" height="34" rx="9" fill="#FF0000"/>
  <polygon points="51,515 51,527 62,521" fill="#FFFFFF"/>
  <text x="82" y="518" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0F172A">YouTube Access</text>
  <text x="82" y="534" font-family="sans-serif" font-size="11" fill="#64748B">28m used today • Limit: 30m/day</text>
  <rect x="38" y="552" width="284" height="6" rx="3" fill="#F1F5F9"/>
  <rect x="38" y="552" width="262" height="6" rx="3" fill="#F59E0B"/>
  
  <rect x="38" y="572" width="88" height="34" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="82" y="593" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#334155">Edit Limit</text>
  <rect x="136" y="572" width="88" height="34" rx="8" fill="#FFFBEB" stroke="#F59E0B"/>
  <text x="180" y="593" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#D97706">+Extra Time</text>
  <rect x="234" y="572" width="88" height="34" rx="8" fill="#4F46E5"/>
  <text x="278" y="593" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">Details</text>

  <!-- Bottom Navigation Bar -->
  <rect x="12" y="646" width="336" height="62" rx="24" fill="#FFFFFF" filter="url(#cardShadow)"/>
  <rect x="30" y="656" width="54" height="28" rx="14" fill="#EEF2FF"/>
  <text x="57" y="674" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#4F46E5">Home</text>
  <text x="122" y="674" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748B">Apps</text>
  <text x="186" y="674" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748B">Fun</text>
  <text x="248" y="674" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748B">History</text>
  <text x="308" y="674" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748B">Settings</text>
</svg>
